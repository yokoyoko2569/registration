<!DOCTYPE html>

<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>
    YOKO YOKO Member
  </title>


  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #f3e8e2;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }


    #appFrame {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: 0;

      background: #f3e8e2;
    }


    #loading {
      position: absolute;

      inset: 0;

      z-index: 10;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 24px;

      text-align: center;

      color: #7a4a25;

      background: #f3e8e2;
    }


    #loading.hidden {
      display: none;
    }


    .box {
      width: 100%;
      max-width: 320px;

      line-height: 1.55;
    }


    .title {
      margin-bottom: 8px;

      color: #3d1e0a;

      font-size: 22px;
      font-weight: 800;
    }


    .message {
      font-size: 15px;
    }

  </style>

</head>


<body>


  <div id="loading">

    <div class="box">

      <div class="title">
        YOKO YOKO
      </div>

      <div
        id="loadingText"
        class="message"
      >
        กำลังเปิดระบบสมาชิก...
      </div>

    </div>

  </div>


  <iframe
    id="appFrame"
    title="YOKO YOKO Member"
  ></iframe>



  <script>

    /*
     * ============================================
     * CONFIG
     * ============================================
     */

    const LIFF_ID =
      '2010317821-PogKrdLy';


    const GAS_URL =
      'https://script.google.com/macros/s/AKfycbxgGsr8lC-iXbzZHsnDuGTx8NDuKuI8wRYG2U644KQH0aR9F4uDfXKSIw_Xuzpc4mSr/exec';


    /*
     * ============================================
     * ELEMENTS
     * ============================================
     */

    const frame =
      document.getElementById(
        'appFrame'
      );


    const loading =
      document.getElementById(
        'loading'
      );


    const loadingText =
      document.getElementById(
        'loadingText'
      );



    /*
     * ============================================
     * STATE
     * ============================================
     */

    let currentPage =
      'register';


    let auth = {

      idToken: '',

      displayName: ''
    };



    /*
     * ============================================
     * GET PAGE
     * ============================================
     */

    function getRequestedPage() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      /*
       * Page ปกติ
       */
      const pages =
        params.getAll('page');


      if (
        pages.length > 0
      ) {

        const last =
          String(
            pages[
              pages.length - 1
            ]
          )
          .toLowerCase();


        return last === 'points'
          ? 'points'
          : 'register';
      }


      /*
       * Fallback สำหรับ LINE liff.state
       */
      const state =
        params.get(
          'liff.state'
        );


      if (state) {

        try {

          let decoded =
            decodeURIComponent(
              state
            );


          if (
            decoded.startsWith('/')
          ) {

            decoded =
              decoded.substring(1);
          }


          if (
            decoded.startsWith('?')
          ) {

            decoded =
              decoded.substring(1);
          }


          const stateParams =
            new URLSearchParams(
              decoded
            );


          const statePages =
            stateParams.getAll(
              'page'
            );


          if (
            statePages.length > 0
          ) {

            const statePage =
              String(
                statePages[
                  statePages.length - 1
                ]
              )
              .toLowerCase();


            return statePage ===
              'points'

              ? 'points'

              : 'register';
          }

        } catch (error) {

          console.warn(
            'Cannot parse liff.state',
            error
          );
        }
      }


      return 'register';
    }



    /*
     * ============================================
     * LIFF INIT
     * ============================================
     */

    async function initApp() {

      try {

        loadingText.textContent =
          'กำลังเชื่อมต่อ LINE...';


        await liff.init({
          liffId:
            LIFF_ID
        });


        /*
         * อ่าน page หลัง liff.init
         */
        currentPage =
          getRequestedPage();


        console.log(
          'YOKO page:',
          currentPage
        );


        /*
         * Login
         */
        if (
          !liff.isLoggedIn()
        ) {

          loadingText.textContent =
            'กำลังเข้าสู่ระบบ LINE...';


          liff.login();

          return;
        }



        /*
         * ID Token
         */
        auth.idToken =
          liff.getIDToken() || '';


        if (
          !auth.idToken
        ) {

          showFatal(
            'ไม่สามารถรับข้อมูลยืนยันตัวตน LINE ได้ กรุณาตรวจสอบว่า LIFF เปิด Scope: openid'
          );

          return;
        }



        /*
         * Profile
         */
        try {

          const profile =
            await liff.getProfile();


          auth.displayName =
            profile &&
            profile.displayName

              ? profile.displayName

              : '';

        } catch (error) {

          console.warn(
            'Cannot get profile:',
            error
          );


          auth.displayName =
            '';
        }



        /*
         * เปิด Apps Script
         */
        loadFrame(
          currentPage
        );


      } catch (error) {

        console.error(
          'LIFF ERROR:',
          error
        );


        showFatal(
          'เปิดระบบสมาชิกไม่สำเร็จ กรุณาปิดแล้วลองใหม่อีกครั้ง'
        );
      }
    }



    /*
     * ============================================
     * OPEN GAS PAGE
     * ============================================
     */

    function loadFrame(
      page
    ) {

      currentPage =
        page === 'points'

          ? 'points'

          : 'register';


      loading.classList.remove(
        'hidden'
      );


      loadingText.textContent =
        currentPage === 'points'

          ? 'กำลังเปิดหน้าแต้มสะสม...'

          : 'กำลังเปิดหน้าสมัครสมาชิก...';



      /*
       * Cache busting
       */
      const version =
        Date.now();


      frame.src =
        GAS_URL +

        '?page=' +

        encodeURIComponent(
          currentPage
        ) +

        '&v=' +

        version;
    }



    /*
     * ============================================
     * FRAME LOADED
     * ============================================
     */

    frame.addEventListener(
      'load',
      function() {

        loading.classList.add(
          'hidden'
        );


        /*
         * ส่งทันที
         */
        sendAuthToFrame();


        /*
         * ส่งซ้ำอีกหลายครั้ง
         * ป้องกัน child listener
         * ยังโหลดไม่ทัน
         */
        setTimeout(
          sendAuthToFrame,
          250
        );


        setTimeout(
          sendAuthToFrame,
          700
        );


        setTimeout(
          sendAuthToFrame,
          1500
        );
      }
    );



    /*
     * ============================================
     * RECEIVE MESSAGE FROM GAS
     * ============================================
     */

window.addEventListener(
  'message',
  function(event) {

    const data =
      event.data || {};


    /*
     * รับเฉพาะข้อความของระบบ YOKO YOKO
     */
    if (
      data.type !== 'YOKO_REQUEST_AUTH' &&
      data.type !== 'YOKO_NAVIGATE'
    ) {
      return;
    }


    /*
     * Apps Script ของ Google อาจอยู่บน
     * script.google.com หรือ googleusercontent.com
     */
    const allowedOrigin =
      event.origin === 'https://script.google.com' ||
      event.origin.endsWith('.googleusercontent.com');


    if (!allowedOrigin) {

      console.warn(
        'Blocked message from:',
        event.origin
      );

      return;
    }


    /*
     * Points / Index ขอ LINE Auth
     *
     * สำคัญ:
     * ส่งกลับไปยัง window ที่ร้องขอโดยตรง
     * ไม่ส่งผ่าน frame.contentWindow
     */
    if (
      data.type ===
      'YOKO_REQUEST_AUTH'
    ) {

      if (!auth.idToken) {
        return;
      }


      event.source.postMessage(
        {
          type: 'YOKO_AUTH',

          idToken:
            auth.idToken,

          displayName:
            auth.displayName
        },

        event.origin
      );


      return;
    }


    /*
     * เปลี่ยนหน้า
     */
    if (
      data.type ===
      'YOKO_NAVIGATE'
    ) {

      const nextPage =
        data.page === 'points'
          ? 'points'
          : 'register';


      loadFrame(
        nextPage
      );

      return;
    }
  }
);



    /*
     * ============================================
     * SEND LINE AUTH
     * ============================================
     */

    function sendAuthToFrame() {

      if (
        !frame.contentWindow
      ) {

        return;
      }


      if (
        !auth.idToken
      ) {

        return;
      }


      frame.contentWindow
        .postMessage(
          {

            type:
              'YOKO_AUTH',

            idToken:
              auth.idToken,

            displayName:
              auth.displayName

          },
          '*'
        );
    }



    /*
     * ============================================
     * FATAL ERROR
     * ============================================
     */

    function showFatal(
      message
    ) {

      loading.classList.remove(
        'hidden'
      );


      loadingText.textContent =
        message;
    }



    /*
     * ============================================
     * START
     * ============================================
     */

    initApp();

  </script>

</body>

</html>
